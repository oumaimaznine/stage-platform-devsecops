apiVersion: apps/v1
kind: Deployment
metadata:
  name: stage-frontend
  labels:
    app: stage-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stage-frontend
  template:
    metadata:
      labels:
        app: stage-frontend
    spec:
      containers:
        - name: stage-frontend
          image: stageplatform-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: stage-frontend-service
spec:
  selector:
    app: stage-frontend
  ports:
    - protocol: TCP
      port: 5173
      targetPort: 5173
  type: ClusterIP