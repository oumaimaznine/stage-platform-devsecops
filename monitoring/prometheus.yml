global:
  scrape_interval: 30s
  scrape_timeout: 25s
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'cadvisor'
    scrape_interval: 60s
    scrape_timeout: 55s
    static_configs:
      - targets: ['cadvisor:8080']
  - job_name: 'kube-state-metrics'
    scrape_interval: 30s
    static_configs:
      - targets: ['host.docker.internal:9095']